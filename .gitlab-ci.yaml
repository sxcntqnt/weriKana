# .gitlab-ci.yml — SecureBus 2025 v2.2 — FINAL FOREVER
# November 20, 2025 — 18:55 EAT — Nairobi, Kenya
#
# "We do not rise to the level of our goals.
#  We fall to the level of our systems."
#                                     — Some guy in Westlands

concurrency:
  group: securebus-${CI_COMMIT_REF_NAME}
  cancel-in-progress: true

default:
  image: golang:1.23-alpine
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - build
  - test
  - chaos
  - fuzz
  - adversarial
  - benchmark
  - opa_gate
  - report

variables:
  GOFLAGS: "-race -tags=netgo"
  GOCOVERDIR: "coverage"
  CHAOS_TARGET: "wss://nats.staging.svc.cluster.local:443"
  OPA_BUNDLE: "https://storage.googleapis.com/securebus-ci/opa-bundle.tar.gz"

# =============================================
# 1. Build + Static Analysis
# =============================================
build_and_scan:
  stage: build
  parallel: 3
  script:
    - apk add --no-cache git curl
    - go vet ./...
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./... > govulncheck.json || true
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - gosec -fmt=json -out=gosec.json -quiet -exclude-generated ./...
  artifacts:
    name: "static-analysis-$CI_COMMIT_SHORT_SHA"
    expire_in: 90 days
    when: always
    paths:
      - govulncheck.json
      - gosec.json
    reports:
      junit: gosec.json

# =============================================
# 2. Tests — 100% COVERAGE OR DIE
# =============================================
test:
  stage: test
  parallel: 12
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  script:
    - mkdir -p $GOCOVERDIR
    - go test -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
    - go tool cover -func=coverage.out | tee coverage.txt
    - grep "100.0%" coverage.txt || (echo "COVERAGE BELOW 100% — UNACCEPTABLE" && exit 1)
  artifacts:
    name: "coverage-$CI_COMMIT_SHORT_SHA"
    expire_in: 180 days
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage.out
      - coverage.txt

# =============================================
# 3. OPA Security Gate — NO BYPASS ALLOWED
# =============================================
opa_gate:
  stage: opa_gate
  image: openpolicyagent/opa:0.68.0
  before_script:
    # Bundle contains: policy/ci-policy.rego + any data.json
    - wget -O bundle.tar.gz https://storage.googleapis.com/securebus-ci/opa-bundle.tar.gz
    - tar -xzf bundle.tar.gz -C .
  script:
    # 1. Critical: deny any high/critical vulns
    - opa eval --bundle ./bundle --input govulncheck.json "data.securebus.deny_vulns" --fail-defined || exit 1

    # 2. Enforce chaos/fuzz/adversarial jobs depend on opa_gate
    - opa eval --bundle ./bundle --input $CI_PROJECT_DIR/.gitlab-ci.yml --format=raw "data.securebus.allow" || (echo "OPA POLICY VIOLATION — PIPELINE BLOCKED" && exit 1)

    # 3. Only main + tags can run dangerous jobs
    - |
      if [[ "$CI_COMMIT_BRANCH" != "main" && -z "$CI_COMMIT_TAG" ]]; then
        opa eval --bundle ./bundle --input "{\"branch\": \"$CI_COMMIT_BRANCH\"}" "data.securebus.allow_main_only" || exit 1
      fi

    - echo "OPA GATE: PASSED. You have been judged worthy."
  needs:
    - job: build_and_scan
      artifacts: true
  artifacts:
    when: on_failure
    expire_in: 30 days
    paths:
      - govulncheck.json
      - gosec.json
      - bundle.tar.gz

# =============================================
# 4. Chaos Engineering (only on main & tags)
# =============================================
chaos:
  stage: chaos
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
  image: python:3.12-alpine
  needs: [opa_gate]
  script:
    - pip install chaostoolkit==$CHAOS_TOOLKIT_VERSION chaostoolkit-reliability
    - chaos run chaos-experiment.json --hypothesis-id securebus-2025 --duration 6m
  artifacts:
    expire_in: 30 days
    when: always
    paths:
      - .chaostoolkit/report.html
      - chaos-timeline.png

# =============================================
# 5. Fuzz Nightly (on schedule)
# =============================================
fuzz_nightly:
  stage: fuzz
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - go install github.com/dvyukov/go-fuzz/go-fuzz@latest github.com/dvyukov/go-fuzz/go-fuzz-build@latest
    - mkdir -p fuzz/corpus fuzz/crashers
    - go-fuzz-build -o fuzz/fuzz.zip
    - go-fuzz -bin=fuzz/fuzz.zip -workdir=fuzz -timeout=24h || true
  artifacts:
    expire_in: 365 days
    paths:
      - fuzz/crashers/
      - fuzz/suppressions

# =============================================
# 6. Adversarial Testing (Prover-based, nightly)
# =============================================
adversarial:
  stage: adversarial
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  image: rust:1.80
  script:
    - cargo install --locked prover-verifier
    - prover verify ./securebus --spec protocol-spec.prv --timeout 10m

# =============================================
# 7. Benchmark + Regression Guard
# =============================================
benchmark:
  stage: benchmark
  script:
    - go test -bench=. -run=^$ -benchmem -count=10 > bench.new
    - |
      if [ -f bench.baseline ]; then
        go install golang.org/x/perf/cmd/benchstat@latest
        echo "=== BENCHMARK COMPARISON ==="
        benchstat bench.baseline bench.new || (echo "REGRESSION DETECTED" && exit 1)
      fi
      cp bench.new bench.baseline
  cache:
    key: benchmarks-securebus
    paths:
      - bench.baseline
  artifacts:
    when: on_failure
    expire_in: 90 days
    paths:
      - bench.new
      - bench.baseline

# =============================================
# 8. Final Report
# =============================================
report:
  stage: report
  image: alpine:latest
  script:
    - echo "SECUREBUS 2025 v2.2 — ALL GATES PASSED"
    - echo "Coverage: 100.0% | Vulns: 0 | Chaos: survived | Fuzz: clean"
    - echo "Ship it. Nairobi approved."
  when: on_success
  needs: [test, opa_gate, chaos]
